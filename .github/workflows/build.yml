name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Put the directory code (a secret) into the app
        env:
          DIR_MCODE: ${{ secrets.DIR_MCODE }}
        run: |
          printf 'package com.khair.bakery.remote\n\nobject DirConfig {\n    const val MCODE = "%s"\n}\n' "$DIR_MCODE" > app/src/main/java/com/khair/bakery/remote/DirConfig.kt
      - name: Build debug APK
        id: build
        run: |
          set +e
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee /tmp/build.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish the build log on failure (so it can be read and fixed)
        if: steps.build.outputs.code != '0'
        run: |
          cp /tmp/build.log /tmp/keep.log
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . -q
          cp /tmp/keep.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin build-log
          exit 1
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk khair-bakery-remote.apk
          gh release create "v${{ github.run_number }}" khair-bakery-remote.apk \
            --title "مخبز الخير - التحكم عن بعد (v${{ github.run_number }})" \
            --notes "ملف APK جاهز للتثبيت على أندرويد."
